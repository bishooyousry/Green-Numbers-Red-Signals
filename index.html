<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Green Numbers, Red Signals · Skills Bank</title>
<style>
:root{--navy:#080828;--teal:#40BDA9;--teal-d:#1E8C7B;--ice:#EBF4FF;--coral:#F26A44;--muted:#5B6485;--line:#CBD9F2;--white:#fff;--green:#2FB67C;--red:#E5484D}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Calibri,Carlito,"Segoe UI",system-ui,sans-serif;background:var(--ice);color:var(--navy);font-size:16px;line-height:1.45}
header.top{background:var(--navy);color:#fff;display:flex;align-items:center;gap:14px;padding:10px 18px;flex-wrap:wrap}
header.top img{height:34px}
header.top .t{font-weight:700;font-size:18px;letter-spacing:.01em}
header.top nav{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
header.top nav a{color:#fff;text-decoration:none;font-size:14px;padding:6px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.25)}
header.top nav a.on{background:var(--teal);color:var(--navy);border-color:var(--teal);font-weight:700}
header.top .snd{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:6px 12px;font:inherit;font-size:14px;cursor:pointer}
header.top .snd.on{background:var(--teal);color:var(--navy);border-color:var(--teal);font-weight:700}
main{max-width:1180px;margin:0 auto;padding:18px}
h1{font-size:28px;margin:6px 0 4px}h2{font-size:20px;margin:0 0 8px}h3{font-size:15px;margin:0 0 6px}
.lead{color:var(--muted);margin:0 0 14px}
.card{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 0 14px;box-shadow:0 2px 8px rgba(8,8,40,.05)}
.grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}.g3{grid-template-columns:repeat(3,1fr)}.gd{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.btn{appearance:none;border:0;border-radius:10px;padding:10px 16px;font:inherit;font-weight:700;cursor:pointer;background:var(--teal);color:var(--navy);transition:transform .15s,box-shadow .15s}
.btn.sec{background:var(--white);border:1px solid var(--line);color:var(--navy)}.btn.dark{background:var(--navy);color:#fff}.btn.sm{padding:6px 10px;font-size:13px}.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:not(:disabled):hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(8,8,40,.18)}.btn:not(:disabled):active{transform:scale(.97)}
input,select,textarea{font:inherit;border:1px solid var(--line);border-radius:9px;padding:9px 10px;background:#fff;color:var(--navy);max-width:100%}
textarea{width:100%;min-height:74px}
label{font-size:13px;font-weight:700;color:var(--teal-d);letter-spacing:.06em;text-transform:uppercase;display:block;margin:0 0 4px}
.row{display:flex;gap:10px;align-items:end;flex-wrap:wrap}
.pill{display:inline-block;background:var(--navy);color:#fff;border-radius:999px;padding:3px 12px;font-size:13px;font-weight:700}.pill.t{background:var(--teal);color:var(--navy)}
.code{font-family:"DejaVu Sans Mono",Consolas,monospace;font-weight:700;background:var(--ice);padding:3px 8px;border-radius:6px}
.note{font-size:13px;color:var(--muted)}
.callout{border-left:5px solid var(--teal);background:#E3F6F2;border-radius:8px;padding:10px 14px;font-weight:700}
table{border-collapse:collapse;width:100%}th,td{border:1px solid var(--line);padding:6px 8px;text-align:center}
th{background:var(--navy);color:#fff;font-size:13px;letter-spacing:.06em;text-transform:uppercase}td.lab{text-align:left;font-weight:700;background:var(--ice)}.scroll{overflow-x:auto}
details summary{cursor:pointer;font-weight:700}
.chip{display:inline-block;border-radius:999px;padding:3px 12px;font-size:12px;font-weight:700;border:1px solid var(--line);background:#fff}
.chip.live{background:#E3F6F2;border-color:var(--teal);color:var(--teal-d)}.chip.off{background:#FFF1EC;border-color:var(--coral);color:#B2401F}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--green);margin-left:6px;vertical-align:middle}
.lv{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 4px}
.lv button{flex:1;min-width:52px;border:2px solid var(--line);background:#fff;border-radius:12px;padding:12px 0;font:inherit;font-size:22px;font-weight:700;color:var(--navy);cursor:pointer;transition:transform .15s,background .2s,border-color .2s}
.lv button:hover{transform:translateY(-2px);border-color:var(--teal)}
.lv button.sel{color:#fff;animation:pop .3s ease}
.lv button.sel[data-v="1"]{background:var(--green);border-color:var(--green)}.lv button.sel[data-v="2"]{background:#8CC152;border-color:#8CC152}.lv button.sel[data-v="3"]{background:#F2B544;border-color:#F2B544;color:var(--navy)}.lv button.sel[data-v="4"]{background:#F08A4B;border-color:#F08A4B}.lv button.sel[data-v="5"]{background:var(--red);border-color:var(--red)}
.lvl{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.opts{display:flex;gap:8px;flex-wrap:wrap}.opts button{border:2px solid var(--line);background:#fff;border-radius:999px;padding:8px 16px;font:inherit;font-weight:700;cursor:pointer;color:var(--navy);transition:all .2s}
.opts button.sel{background:var(--teal);border-color:var(--teal)}
.dash{display:grid;gap:8px}.dash .r{display:flex;align-items:center;justify-content:space-between;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.dash .g{width:14px;height:14px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 rgba(47,182,124,.5);animation:greenPulse 2.2s infinite}
.dash .v{font-weight:700;font-size:20px;margin-right:12px}
.dashmini{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin:0 0 12px}
.dashmini b{margin-right:4px}.dashmini .g{width:10px;height:10px;border-radius:50%;background:var(--green);display:inline-block;margin-right:5px;animation:greenPulse 2.2s infinite}
.dashmini span.it{font-size:14px;margin-right:8px;white-space:nowrap}
.sig{display:flex;gap:10px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-left:5px solid var(--red);border-radius:10px;padding:10px 12px;margin:0 0 8px}
.sig.ctx{border-left-color:#F2B544}.sig .f{flex:none;width:12px;height:12px;border-radius:50%;background:var(--red);margin-top:6px;animation:redPulse 1.6s infinite}.sig.ctx .f{background:#F2B544;animation:none}
.known .sig{opacity:.9;margin-bottom:6px;padding:7px 10px;font-size:14px}
.tag{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.track{display:flex;align-items:center;margin:10px 0 2px}
.track .n{flex:none;width:32px;height:32px;border-radius:50%;background:#E3E9F5;color:var(--muted);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;transition:all .4s}
.track .n.done{background:var(--teal);color:var(--navy)}.track .n.cur{background:var(--navy);color:#fff;animation:curPulse 1.6s infinite}
.track .seg{flex:1;height:4px;background:#E3E9F5;position:relative;overflow:hidden}.track .seg i{position:absolute;inset:0;background:var(--teal);transform-origin:left;transform:scaleX(0);transition:transform .8s ease}.track .seg.full i{transform:scaleX(1)}
.bar{height:14px;background:#E3E9F5;border-radius:7px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--green));border-radius:7px;transition:width 1s ease}
.hb{display:flex;align-items:center;gap:10px;margin:5px 0}.hb .nm{width:110px;font-weight:700;font-size:14px}.hb .bar{flex:1}.hb .ct{width:28px;font-weight:700;text-align:right}
.proj table{font-size:24px}.proj th{font-size:16px}.proj td{padding:12px}
/* ---- game feel ---- */
.enter{animation:enter .38s cubic-bezier(.2,.8,.2,1) both}
@keyframes enter{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.96)}60%{transform:scale(1.06)}100%{transform:scale(1)}}
@keyframes greenPulse{0%{box-shadow:0 0 0 0 rgba(47,182,124,.5)}70%{box-shadow:0 0 0 9px rgba(47,182,124,0)}100%{box-shadow:0 0 0 0 rgba(47,182,124,0)}}
@keyframes redPulse{0%{box-shadow:0 0 0 0 rgba(229,72,77,.55)}70%{box-shadow:0 0 0 8px rgba(229,72,77,0)}100%{box-shadow:0 0 0 0 rgba(229,72,77,0)}}
@keyframes curPulse{0%,100%{box-shadow:0 0 0 0 rgba(8,8,40,.35)}50%{box-shadow:0 0 0 7px rgba(8,8,40,0)}}
.stagger{opacity:0;animation:rise .55s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes rise{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
.stamp{display:inline-block;animation:stamp .55s cubic-bezier(.2,1.4,.4,1) both}
@keyframes stamp{0%{opacity:0;transform:scale(2.4) rotate(-12deg)}100%{opacity:1;transform:scale(1) rotate(-3deg)}}
.cnt.fu{color:var(--green)}
#splash{position:fixed;inset:0;background:var(--navy);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:50;pointer-events:none;opacity:0;animation:splash 1.7s ease forwards}
#splash .d{font-size:clamp(46px,13vw,110px);font-weight:700;letter-spacing:.06em;color:var(--teal);line-height:1}
#splash .s{font-size:clamp(18px,4.2vw,30px);opacity:.92;margin-top:10px;text-align:center;padding:0 22px}
#splash.hot .d{color:var(--coral)}
@keyframes splash{0%{opacity:0;transform:scale(1.06)}16%{opacity:1;transform:scale(1)}82%{opacity:1}100%{opacity:0;transform:scale(.98)}}
#toasts{position:fixed;right:14px;bottom:14px;z-index:60;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--navy);color:#fff;border-left:5px solid var(--teal);border-radius:10px;padding:10px 14px;font-weight:700;box-shadow:0 6px 18px rgba(8,8,40,.3);animation:toast 3.4s ease forwards}
@keyframes toast{0%{opacity:0;transform:translateX(30px)}10%{opacity:1;transform:none}85%{opacity:1}100%{opacity:0;transform:translateX(20px)}}
.draw{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw 1.3s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.stagger{opacity:1!important}.draw{stroke-dashoffset:0!important}#splash{display:none}}
@media(max-width:640px){h1{font-size:23px}main{padding:12px}.hb .nm{width:84px}}
</style>
</head>

tly.", "After one difficult customer interaction he says: “I don’t know if I’m handling these accounts as well as I used to.”", "His results are still above target."], "task": "Update your concern level.", "ask": "What pattern do you see?", "fields": ["Energy", "Connection", "Efficacy"]}, {"n": 5, "title": "Look Beyond the Person", "lead": "During the same period", "facts": ["Omar inherited two additional strategic accounts.", "One team member left and has not yet been replaced.", "Customer escalations require multiple internal approvals.", "Quarter-end expectations increased.", "Omar has very little control over workload allocation."], "task": "Update your concern level.", "ask": "What work conditions may be contributing to the pattern?", "lens": ["Workload", "Control", "Reward", "Community", "Fairness", "Values"]}], "final": {"title": "Final Question", "q": "The dashboard is still green. Has your leadership response changed?", "options": ["Yes", "No", "Not sure"], "ask": "What would you do differently?"}, "closing": ["GREEN NUMBERS. RED SIGNALS.", "Current output can stay high while the cost of producing it is rising."], "trainer": {"general": "Do not allow participants to diagnose the employee or use medical labels. Keep the discussion on observable changes, patterns and work-related factors. After each stage, participants update their view using only the information they have so far.", "1": "Ask: “What evidence supports your rating?”", "2": "Trainer prompt: “Is high effort automatically a problem?” Expected answer: No – but change, persistence and patterns are what matter. They are starting to look at energy / recovery risk, yet performance remains strong.", "3": "Ask them to update the concern level, then notice what is changing besides the work pattern.", "4": "Ask: “What pattern do you see?” (Energy · Connection · Efficacy)", "5": "Once they notice the pattern, the work environment appears. Ask: “What work conditions may be contributing to the pattern?” Lens: const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function load(k, d){ try{ const v = JSON.parse(localStorage.getItem(k)); return v ?? d; }catch(e){ return d; } }
function save(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function copy(text, btn){ (navigator.clipboard?navigator.clipboard.writeText(text):Promise.reject()).catch(()=>{ const t=document.createElement("textarea"); t.value=text; document.body.appendChild(t); t.select(); try{document.execCommand("copy");}catch(e){} t.remove(); }).finally(()=>{ if(btn){ const o=btn.textContent; btn.textContent="Copied"; setTimeout(()=>btn.textContent=o,1200);} }); }
const randSession = () => { const a="ABCDEFGHJKMNPQRSTUVWXYZ23456789"; let s=""; for(let i=0;i<6;i++) s+=a[Math.floor(Math.random()*a.length)]; return s; };
function roundCode(session, r){ let h=5381; const s=(session||"").toUpperCase()+"|"+r; for(const c of s) h=((h<<5)+h+c.charCodeAt(0))>>>0; return String(1000+(h%9000)); }
const stageName = s => s===FINAL ? "Final question" : "Stage "+s;
const avg = a => { const v=a.filter(x=>typeof x==="number"); return v.length ? v.reduce((p,c)=>p+c,0)/v.length : null; };

const REDUCED = () => window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
const STATS = {enter:0, sfx:[], splash:0};
let LAST_KEY="", ANIM_NOW=false, PREV={}, FRESH_T=0, TOKEN=0;
let AC=null, MASTER=null;
function soundEnabled(){ const v=load("gn.snd",null); return v!==null ? v : true; }   // sound is on by default everywhere
function audio(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); MASTER=AC.createGain(); MASTER.gain.value=.9; MASTER.connect(AC.destination); }catch(e){ return null; } } if(AC.state==="suspended") AC.resume(); return AC; }
function tone(f,t,d,type="sine",v=.12,glide){ const T=AC.currentTime+t, o=AC.createOscillator(), g=AC.createGain(); o.type=type; o.frequency.setValueAtTime(f,T); if(glide) o.frequency.exponentialRampToValueAtTime(glide,T+d); g.gain.setValueAtTime(.0001,T); g.gain.linearRampToValueAtTime(v,T+.012); g.gain.exponentialRampToValueAtTime(.0001,T+d); o.connect(g); g.connect(MASTER); o.start(T); o.stop(T+d+.05); }
function whoosh(t,d,from,to,v=.16){ const T=AC.currentTime+t, len=Math.floor(AC.sampleRate*d), buf=AC.createBuffer(1,len,AC.sampleRate), data=buf.getChannelData(0); for(let i=0;i<len;i++) data[i]=Math.random()*2-1; const src=AC.createBufferSource(); src.buffer=buf; const f=AC.createBiquadFilter(); f.type="bandpass"; f.Q.value=1.1; f.frequency.setValueAtTime(from,T); f.frequency.exponentialRampToValueAtTime(to,T+d); const g=AC.createGain(); g.gain.setValueAtTime(.0001,T); g.gain.linearRampToValueAtTime(v,T+d*.35); g.gain.exponentialRampToValueAtTime(.0001,T+d); src.connect(f); f.connect(g); g.connect(MASTER); src.start(T); }
function sfx(name,arg){
  if(!soundEnabled()) return; STATS.sfx.push(name); if(!audio()) return;
  switch(name){
    case "tap": tone(900,0,.035,"triangle",.05); break;
    case "level": tone(300+(arg||1)*110,0,.12,"triangle",.13); break;
    case "stage": whoosh(0,.5,250,2600,.18); tone(90,.05,.4,"sine",.3,45); for(let i=0;i<(arg||1);i++) tone(760,.5+i*.16,.07,"square",.05); break;
    case "alarm": for(let i=0;i<3;i++){ tone(520,i*.36,.17,"sawtooth",.06,330); tone(330,i*.36+.18,.17,"sawtooth",.06,220); } tone(60,0,1.1,"sine",.22,40); break;
    case "signal": tone(190+(arg||0)*35,0,.16,"sawtooth",.08,150); break;
    case "green": tone(660,0,.1,"triangle",.1); tone(880,.1,.16,"triangle",.1); break;
    case "send": tone(120,0,.2,"sine",.3,55); tone(440,.05,.1,"triangle",.12); tone(660,.14,.2,"triangle",.12); break;
    case "fanfare": [523,659,784,1047].forEach((f,i)=>tone(f,i*.11,.2,"triangle",.12)); [523,659,784].forEach(f=>tone(f,.5,.9,"triangle",.07)); break;
    case "join": tone(523,0,.09,"triangle",.1); tone(659,.09,.09,"triangle",.1); tone(784,.18,.22,"triangle",.1); break;
    case "ping": tone(1320,0,.09,"sine",.1); tone(1760,.09,.14,"sine",.07); break;
    case "unlock": tone(660,0,.1,"triangle",.11); tone(990,.1,.2,"triangle",.11); break;
    case "error": tone(180,0,.22,"square",.07); tone(140,.2,.3,"square",.07); break;
  }
}
const cnt=(key,to,from,suf="")=>`<span class="cnt" data-k="${key}" data-to="${to}" data-from="${from===undefined?to:from}" data-suf="${suf}">${to}${suf}</span>`;
function runFx(fresh){
  document.querySelectorAll(".cnt").forEach(el=>{
    const to=+el.dataset.to, key=el.dataset.k, suf=el.dataset.suf||"", was=PREV[key];
    const from=(fresh && el.dataset.from!==undefined) ? +el.dataset.from : (was!==undefined ? +was : to); PREV[key]=to;
    if(from===to || REDUCED()) return;
    const t0=performance.now(), dur=1100; el.classList.add("fu"); el.textContent=from+suf;
    const step=now=>{ const k=Math.min(1,(now-t0)/dur), e=1-Math.pow(1-k,3); el.textContent=(k<1?Math.round(from+(to-from)*e):to)+suf; if(k<1) requestAnimationFrame(step); else el.classList.remove("fu"); };
    requestAnimationFrame(step);
  });
  document.querySelectorAll(".bar i[data-w]").forEach(i=>{ if(REDUCED()) i.style.width=i.dataset.w+"%"; else setTimeout(()=>{ i.style.width=i.dataset.w+"%"; },300); });
}
function showSplash(big, small, hot){ if(REDUCED()) return; STATS.splash++; const old=$("#splash"); if(old) old.remove(); const d=document.createElement("div"); d.id="splash"; d.className=hot?"hot":""; d.innerHTML=`<div class="d">${esc(big)}</div><div class="s">${esc(small)}</div>`; document.body.appendChild(d); setTimeout(()=>{ const x=$("#splash"); if(x) x.remove(); },1800); }
function toast(msg){ const box=$("#toasts"); if(!box) return; const t=document.createElement("div"); t.className="toast"; t.textContent=msg; box.appendChild(t); setTimeout(()=>t.remove(),3500); }

/* ===================== live sync (free public relay: ntfy.sh) ===================== */
const hash6 = s => { let h=5381; for(const c of String(s)) h=((h<<5)+h+c.charCodeAt(0))>>>0; return h.toString(36).padStart(6,"0").slice(-6); };
const topicOf = s => "sb-gn-"+String(s||"").toLowerCase().replace(/[^a-z0-9]/g,"")+"-"+hash6("gn"+String(s||"").toUpperCase());
function relayBase(){ const q=new URLSearchParams(location.search).get("relay")||new URLSearchParams((location.hash.split("?")[1])||"").get("relay")||RELAY_DEFAULT; return q.endsWith("/")?q:q+"/"; }
const SYNC = {es:null, topic:"", last:null, status:"off", timer:null, session:"", role:"", seen:new Set(), fail:0, t0:0};
function setStatus(st){ SYNC.status=st; const el=$("#syncchip"); if(el){ el.className="chip "+(st==="live"?"live":"off"); el.textContent=st==="live"?"Live sync: connected":(st==="connecting"?"Live sync: connecting…":"Live sync: offline (use the codes)"); } }
function syncStop(){ if(SYNC.es){ SYNC.es.close(); SYNC.es=null; } clearTimeout(SYNC.timer); SYNC.status="off"; SYNC.session=""; SYNC.role=""; }
function syncStart(session, role){ if(!session) return; if(SYNC.session===session && SYNC.role===role && (SYNC.es||SYNC.timer)) return; syncStop(); SYNC.session=session; SYNC.role=role; SYNC.topic=topicOf(session); SYNC.last=null; SYNC.seen=new Set(); SYNC.t0=Date.now()-1500; setStatus("connecting"); syncConnect(); }
function syncConnect(){
  if(!SYNC.session) return;
  const url=relayBase()+SYNC.topic+"/sse"+(SYNC.last?("?since="+SYNC.last):"?since=all"); let es; try{ es=new EventSource(url); }catch(e){ setStatus("off"); return; }
  SYNC.es=es; es.onopen=()=>{ SYNC.fail=0; setStatus("live"); };
  es.onmessage=ev=>{ try{ const m=JSON.parse(ev.data); if(m.event && m.event!=="message") return; if(m.id){ if(SYNC.seen.has(m.id)) return; SYNC.seen.add(m.id); SYNC.last=m.id; } onSyncMessage(JSON.parse(m.message)); }catch(e){} };
  es.onerror=()=>{ SYNC.fail++; setStatus(SYNC.fail>=2?"off":"connecting"); try{es.close();}catch(e){} SYNC.es=null; SYNC.timer=setTimeout(syncConnect,2500); };
}
async function syncSend(p){ if(!SYNC.topic) return false; try{ const r=await fetch(relayBase()+SYNC.topic,{method:"POST",body:JSON.stringify(Object.assign({ts:Date.now()},p))}); return r.ok; }catch(e){ return false; } }
let softTimer=null;
function softRender(force){ const wait=1800-(Date.now()-FRESH_T); if(!force && !REDUCED() && wait>0){ clearTimeout(softTimer); softTimer=setTimeout(softRender,wait+50); return; }
  const a=document.activeElement; if(a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && $("#app").contains(a)){ clearTimeout(softTimer); softTimer=setTimeout(softRender,1500); return; } route(); }
const FLASH={};
function onSyncMessage(p){
  if(SYNC.role==="fac"){
    if(p.t==="hello"){ FAC.online[p.g]=p.ts||1; if(p.ts>SYNC.t0){ toast("Group "+p.g+" joined"); sfx("ping"); } }
    else if(p.t==="ans" && p.g>=1 && p.g<=8){ if(p.g>FAC.groups) FAC.groups=p.g; facAns(p.g)[p.s]=p.a; FLASH[p.g+"-"+p.s]=Date.now(); setTimeout(softRender,3300);
      if(p.ts>SYNC.t0){ toast("Group "+p.g+" answered "+stageName(p.s)+(p.a&&typeof p.a.l==="number"?" · concern "+p.a.l:(p.a&&p.a.c?" · "+p.a.c:""))); sfx("ping"); } }
    else if(p.t==="set" && p.g>=1 && p.g<=8){ const a=facAns(p.g); a[p.s]=Object.assign({}, a[p.s]||{}, p.a); }
    else if(p.t==="cur"){ FAC.cur=p.cur; }
    else return;
    saveFac(); softRender();
  } else if(SYNC.role==="group" && GRP.n){
    if(p.t==="cur"){ GRP.unlocked=Math.max(GRP.unlocked,p.cur); saveGrp(); softRender(true); return; }
    else if(p.t==="settings"){ if(typeof p.codes==="boolean") GRP.codes=p.codes; }
    else if((p.t==="ans"||p.t==="set") && p.g===GRP.n){ GRP.ans[p.s]=Object.assign({}, GRP.ans[p.s]||{}, p.a); }
    else return;
    saveGrp(); softRender();
  }
}

/* ===================== charts ===================== */
function curveChart(series, o={}){
  const W=620,H=270,P=40, xs=i=>P+i*((W-2*P)/(NS-1)), ys=v=>H-P-(v-1)/4*(H-2*P);
  let g=""; [1,2,3,4,5].forEach(v=>g+=`<line x1="${P}" x2="${W-P}" y1="${ys(v)}" y2="${ys(v)}" stroke="#DCE6F7"/><text x="${P-10}" y="${ys(v)+4}" font-size="12" text-anchor="end" fill="#5B6485">${v}</text>`);
  for(let i=0;i<NS;i++) g+=`<text x="${xs(i)}" y="${H-12}" font-size="12" text-anchor="middle" fill="#5B6485">Stage ${i+1}</text>`;
  g+=`<line x1="${P}" x2="${W-P}" y1="${ys(1)}" y2="${ys(1)}" stroke="#2FB67C" stroke-width="3" stroke-dasharray="7 6"/><text x="${W-P}" y="${ys(1)-8}" font-size="12" text-anchor="end" fill="#1E8C7B" font-weight="700">Dashboard: all green</text>`;
  series.forEach(s=>{
    const pts=s.vals.map((v,i)=>v==null?null:[xs(i),ys(v)]).filter(Boolean); if(!pts.length) return;
    const len=Math.round(pts.reduce((a,p,i)=>i?a+Math.hypot(p[0]-pts[i-1][0],p[1]-pts[i-1][1]):0,0))+10;
    g+=`<polyline class="draw" style="--len:${len}" points="${pts.map(p=>p.join(",")).join(" ")}" fill="none" stroke="${s.color}" stroke-width="${s.w||3}" ${s.dash?'stroke-dasharray="6 5"':""}/>`;
    if(!s.nodots) pts.forEach(p=>g+=`<circle cx="${p[0]}" cy="${p[1]}" r="${(s.w||3)+1}" fill="${s.color}"/>`);
  });
  const lg=series.filter(s=>s.name).map((s,i)=>`<rect x="${P+i*110}" y="6" width="12" height="12" fill="${s.color}"/><text x="${P+i*110+16}" y="16" font-size="12">${esc(s.name)}</text>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:${o.max||700}px">${g}${lg}</svg>`;
}

function shell(inner, tab){

  if(GRP.n && (tab==="#/group")) tabs=[["#/group","Group"]];
  return `<header class="top"><img src="${LOGO}" alt="Skills Bank"><div class="t">Green Numbers, Red Signals</div>
  <nav>${tabs.map(([h,l])=>`<a href="${h}" class="${tab===h?"on":""}">${l}</a>`).join("")}<button class="snd ${soundEnabled()?"on":""}" data-act="snd">${soundEnabled()?"Sound on":"Sound off"}</button></nav></header><main>${inner}</main>`;
}
function trackHtml(done, cur){
  const items=Array.from({length:FINAL},(_,i)=>{ const s=i+1, d=!!GRP.ans[s]; return `<div class="n ${d?"done":(s===cur?"cur":"")}" title="${stageName(s)}">${d?"✓":(s===FINAL?"?":s)}</div>${s<FINAL?`<div class="seg ${GRP.ans[s]?"full":""}"><i></i></div>`:""}`; }).join("");
  return `<div class="track">${items}</div><div class="note" style="text-align:right;margin-top:2px">stages</div>`;
}

  const st=STAGES[s-1];
  if(s===1) return shell(`${top}<div class="card"><span class="pill">Stage 1</span><h2 style="margin-top:8px">${esc(st.title)}</h2><p class="note">${esc(st.lead)}</p>${dashFull()}</div>${stageForm(1)}`, "#/group");
  return shell(`${top}${dashStrip()}<div class="card"><span class="pill">Stage ${s}</span><h2 style="margin-top:8px">${esc(st.title)}</h2><p class="note">${esc(st.lead)}</p>
    ${st.facts.map((f,i)=>`<div class="sig ${s===5?"ctx":""} ${ANIM_NOW?"stagger":""}" style="animation-delay:${(0.35+i*0.45).toFixed(2)}s" data-sig="${i}"><span class="f"></span><span>${esc(f)}</span></div>`).join("")}</div>${knownSoFar(s)}${stageForm(s)}`, "#/group");
}
function viewSent(){
  const s=GRP.lastSent, a=GRP.ans[s]||{}, cv=curve(GRP.ans);
  return shell(`<div class="card"><span class="pill">${stageName(s)}</span> <span class="${ANIM_NOW?"stamp":""} pill t" style="margin-left:6px">Sent ✓</span>
   <p style="margin:10px 0">${typeof a.l==="number"?"Our concern level: <b>"+a.l+"</b> of 5":"Our answer: <b>"+esc(a.c||"")+"</b>"}</p>
   ${s<=NS?`<div>${curveChart([{name:"Our concern",color:"#F26A44",vals:cv}],{max:560})}</div>`:""}
   <p class="note"><span id="sentnote">${GRP.sent&&GRP.sent[s]?"Delivered to your facilitator ✓":"Not delivered yet. If it stays like this, tell your facilitator."}</span> Wait for the facilitator to open the next stage.</p>
   <a class="btn" href="#/group" data-act="next" style="display:inline-block;margin-top:6px">Continue</a></div>`, "#/group");
}

/* ===================== facilitator ===================== */
function trainerHtml(cur){
  const t=DATA.trainer, txt = t[String(cur)];
  return `<div class="card"><h2>Trainer notes <span class="note">(facilitator only)</span></h2><div class="callout" style="font-weight:400">${esc(t.general)}</div>${txt?`<p style="margin-top:10px"><b>${cur>=1&&cur<=NS?stageName(cur):(cur===FINAL?"Final question":"Debrief")}:</b> ${esc(txt)}</p>`:""}</div>`;
}
function answeredCount(s){ let c=0; for(let g=1;g<=FAC.groups;g++){ const a=(FAC.ans[g]||{})[s]; if(a && (a.l||a.c)) c++; } return c; }
function viewFacilitator(){
  const n=FAC.groups, cur=FAC.cur;
  const link=location.href.split("#")[0]+`#/group?s=${encodeURIComponent(FAC.session)}&c=${FAC.codes?1:0}`;
  const label = cur===0?"not started yet":(cur<=NS?stageName(cur):(cur===FINAL?"Final question":"Debrief"));
  const openBtns=[...Array.from({length:NS},(_,i)=>i+1),FINAL,DEBRIEF].map(r=>`<button class="btn ${cur===r?"":"sec"}" data-act="opencur" data-v="${r}">${cur===r?(r===DEBRIEF?"Debrief · open":stageName(r)+" · open"):(r===DEBRIEF?"Debrief":"Open "+stageName(r))}</button>`).join(" ");
  const head=Array.from({length:NS},(_,i)=>`<th>Stage ${i+1}</th>`).join("")+"<th>Final</th>";
  const rows=Array.from({length:n},(_,gi)=>{ const g=gi+1, a=FAC.ans[g]||{};
    const cells=Array.from({length:NS},(_,i)=>{ const s=i+1, v=level(a,s); return `<td class="${FLASH[g+"-"+s]&&Date.now()-FLASH[g+"-"+s]<3000?"fresh":""}" style="${FLASH[g+"-"+s]&&Date.now()-FLASH[g+"-"+s]<3000?"background:#E3F6F2":""}"><select data-act="cell" data-g="${g}" data-s="${s}"><option value="">—</option>${[1,2,3,4,5].map(x=>`<option ${v===x?"selected":""}>${x}</option>`).join("")}</select></td>`; }).join("");
    const fv=a[FINAL]&&a[FINAL].c; return `<tr><td class="lab">Group ${g}${FAC.online[g]?'<span class="dot"></span>':""}</td>${cells}<td>${fv?esc(fv):"—"}</td></tr>`; }).join("");
  const series=Array.from({length:n},(_,i)=>({name:"G"+(i+1),color:GCOL[i%GCOL.length],vals:curve(FAC.ans[i+1]||{})})).filter(s=>s.vals.some(v=>v!=null));
  const av=Array.from({length:NS},(_,i)=>{ const v=avg(Array.from({length:n},(_,g)=>level(FAC.ans[g+1]||{},i+1))); return v==null?null:Math.round(v*100)/100; });
  if(av.some(v=>v!=null)) series.push({name:"Average",color:"#080828",vals:av,w:5,dash:true,nodots:false});
  const cs = cur>=1&&cur<=FINAL ? `<div class="row" style="margin:8px 0"><div style="flex:1;min-width:200px"><div class="bar"><i data-w="${Math.round(answeredCount(cur)/Math.max(1,n)*100)}"></i></div></div><b>${answeredCount(cur)} / ${n} groups answered</b></div>` : "";
  return shell(`<h1>Facilitator console</h1><p class="lead">Now showing: <b>${label}</b>. <span id="syncchip" class="chip"></span> Answers arrive by themselves.</p>
  <div class="card"><details><summary>Setup and group link</summary><div class="row" style="margin-top:10px">
   <div><label>Groups</label><select data-act="groups">${[2,3,4,5,6,7,8].map(x=>`<option ${x===n?"selected":""}>${x}</option>`).join("")}</select></div>
   <div><label>Session code</label><input data-act="session" value="${esc(FAC.session)}" size="10"></div>
   <div><label>Stages locked until you open them</label><select data-act="codes"><option value="1" ${FAC.codes?"selected":""}>Yes</option><option value="0" ${!FAC.codes?"selected":""}>No (groups move freely)</option></select></div>
   <button class="btn sec sm" data-act="newsession">New session code</button></div>
   <p class="note" style="margin-top:10px">Live sync uses the free public relay ntfy.sh with a private topic made from your session code, so use a new session code for every session. The hidden content is part of the page code, so treat this as a classroom tool, not a secure exam.</p>
   <p style="margin-top:8px"><label>Link to send to the groups</label><span class="code" style="word-break:break-all">${esc(link)}</span> <button class="btn sec sm" data-act="copylink">Copy</button></p></details></div>
  <div class="card"><h2>Open the stages</h2><div class="row">${openBtns}</div>${cs}${(cur>=1&&cur<=FINAL)?`<p class="note" style="margin-top:10px">Backup code for ${stageName(cur)} (only if a group is offline): <span class="code">${roundCode(FAC.session,cur)}</span></p>`:`<p class="note" style="margin-top:10px">${cur===0?"Nothing is open yet. Press Open Stage 1 when the groups have read the case.":"Open Debrief on the projector."}</p>`}</div>
  ${trainerHtml(cur)}
  <div class="card"><h2>Concern levels</h2><div class="scroll"><table><tr><th></th>${head}</tr>${rows}</table></div><div style="margin-top:12px">${curveChart(series)}</div></div>
  <div class="row"><button class="btn sec sm" data-act="export">Export session</button><button class="btn sec sm" data-act="reset">Reset session</button></div>`, "#/facilitator");
}
function lensCounts(){ const c={}; (STAGES[NS-1].lens||[]).forEach(k=>c[k]=0); for(let g=1;g<=FAC.groups;g++){ const a=(FAC.ans[g]||{})[NS]; ((a&&a.x&&a.x.lens)||[]).forEach(k=>{ c[k]=(c[k]||0)+1; }); } return c; }
function viewDebrief(){
  const n=FAC.groups, cur=FAC.cur;
  const series=Array.from({length:n},(_,i)=>({name:"G"+(i+1),color:GCOL[i%GCOL.length],vals:curve(FAC.ans[i+1]||{}),w:2})).filter(s=>s.vals.some(v=>v!=null));
  const av=Array.from({length:NS},(_,i)=>{ const v=avg(Array.from({length:n},(_,g)=>level(FAC.ans[g+1]||{},i+1))); return v==null?null:Math.round(v*100)/100; });
  series.push({name:"Room average",color:"#080828",vals:av,w:6});
  const avgRow=`<div class="grid gd">${av.map((v,i)=>`<div class="card" style="text-align:center;margin:0"><div class="tag">Stage ${i+1}</div><div style="font-size:34px;font-weight:700">${v==null?"—":cnt("av"+i,Math.round(v*10)/10,1)}</div></div>`).join("")}</div>`;
  const lc=lensCounts(), maxl=Math.max(1,...Object.values(lc));
  const lens=Object.entries(lc).map(([k,v])=>`<div class="hb"><span class="nm">${esc(k)}</span><div class="bar"><i data-w="${Math.round(v/maxl*100)}"></i></div><span class="ct">${v}</span></div>`).join("");
  const fin={}; DATA.final.options.forEach(o=>fin[o]=0); for(let g=1;g<=n;g++){ const a=(FAC.ans[g]||{})[FINAL]; if(a&&a.c) fin[a.c]=(fin[a.c]||0)+1; }
  const texts=(s,key)=>{ const out=[]; for(let g=1;g<=n;g++){ const a=(FAC.ans[g]||{})[s]; if(!a) continue; const v=key?(a.x&&a.x[key]):a.t; if(v) out.push(`<div class="sig ctx" style="border-left-color:${GCOL[(g-1)%GCOL.length]}"><span class="tag" style="min-width:34px">G${g}</span><span>${esc(v)}</span></div>`); } return out.join("")||'<p class="note">No answers yet.</p>'; };
  const pattern = (STAGES[3].fields||[]).map(k=>`<div><h3>${esc(k)}</h3>${texts(4,k)}</div>`).join("");
  return shell(`<h1>Debrief</h1><p class="lead">The dashboard stayed green. Look at what the groups noticed, stage by stage.</p>
  <div class="card">${curveChart(series,{max:900})}</div>${avgRow}
  <div class="grid g2" style="margin-top:12px"><div class="card"><h2>Evidence at Stage 1</h2>${texts(1,null)}</div><div class="card"><h2>What changed (Stage 2)</h2>${texts(2,null)}</div></div>
  <div class="card"><h2>The pattern (Stage 4)</h2><div class="grid g3">${pattern}</div></div>
  <div class="grid g2"><div class="card"><h2>Work conditions (Stage 5)</h2>${lens}</div>
   <div class="card"><h2>${esc(DATA.final.q)}</h2>${Object.entries(fin).map(([k,v])=>`<div class="hb"><span class="nm">${esc(k)}</span><div class="bar"><i data-w="${Math.round(v/Math.max(1,n)*100)}"></i></div><span class="ct">${v}</span></div>`).join("")}<div style="margin-top:8px">${texts(FINAL,null)}</div></div></div>
  <div class="callout">${esc(DATA.closing[0])}<div style="font-weight:400;margin-top:4px">${esc(DATA.closing[1])}</div></div>`, "#/debrief");
}

/* ===================== router + events ===================== */
let SHOW_SENT=false;
const facOK = () => sessionStorage.getItem("gn.ok")==="1";
function screenKey(path){
  if(path==="#/group"){ if(!GRP.n) return "g-join"; if(SHOW_SENT) return "g-sent-"+GRP.lastSent; const s=nextStage(); return "g-"+s+"-"+((GRP.codes && GRP.unlocked<s && s<=FINAL)?"lock":"play"); }
  return path;
}
function splashFor(path, fresh){
  if(!(fresh && path==="#/group" && GRP.n && !SHOW_SENT)) return null;
  const s=nextStage(); if(s>FINAL || (GRP.codes && GRP.unlocked<s)) return null; if(GRP.splashed[s]) return null; GRP.splashed[s]=true; saveGrp();
  if(s===FINAL) return {big:"FINAL", small:"question", hot:true, s};
  const st=STAGES[s-1]; return {big:"STAGE "+s, small:st.title, hot:s>=4, s};
}
function afterRender(path, fresh){
  if(!fresh || !(path==="#/group" && GRP.n)) return;
  if(SHOW_SENT){ sfx("send"); return; }
  const s=nextStage();
  if(s>FINAL){ sfx("fanfare"); return; }
  if(s>=2 && s<=NS && !(GRP.codes && GRP.unlocked<s)){ const n=STAGES[s-1].facts.length; for(let i=0;i<n;i++) setTimeout(()=>sfx(s===NS?"green":"signal",i),(0.35+i*0.45)*1000+100); }
  if(s===1 && !(GRP.codes && GRP.unlocked<1)) setTimeout(()=>sfx("green"),300);
}
function route(){
  const raw=location.hash||"#/"; const [path,qs]=raw.split("?"); const q=Object.fromEntries(new URLSearchParams(qs||""));
  if((path==="#/facilitator"||path==="#/debrief") && !facOK()){ syncStop(); $("#app").innerHTML=viewGate(path); const i=$("[data-act=pin]"); if(i) i.focus(); return; }
  if(path==="#/facilitator"||path==="#/debrief") syncStart(FAC.session,"fac"); else if(path==="#/group" && GRP.n && GRP.session) syncStart(GRP.session,"group"); else syncStop();
  const key=screenKey(path), fresh=key!==LAST_KEY; ANIM_NOW = fresh && !REDUCED();
  let html;
  if(path==="#/facilitator") html=viewFacilitator(); else if(path==="#/debrief") html=viewDebrief();
  else if(path==="#/group") html=SHOW_SENT && GRP.n && GRP.lastSent ? viewSent() : viewGroup(q); else html=viewHome();
  const sp=REDUCED()?null:splashFor(path,fresh);
  const commit=()=>{ $("#app").innerHTML=html; setStatus(SYNC.status); LAST_KEY=key; if(fresh) FRESH_T=Date.now();
    if(fresh && !REDUCED()){ const m=$("#app main"); if(m){ m.classList.add("enter"); STATS.enter++; } }
    runFx(fresh); afterRender(path,fresh); };
  if(sp){ const tok=++TOKEN; LAST_KEY=key; FRESH_T=Date.now(); showSplash(sp.big,sp.small,sp.hot); sfx("stage",sp.s===FINAL?1:sp.s); if(sp.hot) setTimeout(()=>sfx("alarm"),900); setTimeout(()=>{ if(tok===TOKEN) commit(); },1300); return; }
  TOKEN++; commit();
}
window.addEventListener("hashchange",()=>{ SHOW_SENT=false; route(); });
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]"); if(!b) return; const a=b.dataset.act; if(!["lvl","snd"].includes(a)) sfx("tap");
  if(a==="snd"){ const on=!soundEnabled(); save("gn.snd",on); if(on) sfx("ping"); route(); return; }
  if(a==="pinok"){ if($("[data-act=pin]").value.trim()===FAC_PIN){ sessionStorage.setItem("gn.ok","1"); sfx("unlock"); location.hash=b.dataset.target; route(); } else { sfx("error"); $("#pinmsg").textContent="Wrong code."; } return; }
  if(a==="opencur"){ FAC.cur=+b.dataset.v; saveFac(); route(); syncSend({t:"cur",cur:FAC.cur}); syncSend({t:"settings",codes:FAC.codes}); return; }
  if(a==="copylink"){ copy($(".code[style*='break-all']").textContent, b); return; }
  if(a==="newsession"){ if(confirm("Create a new session code? Groups will need the new link.")){ FAC.session=randSession(); saveFac(); syncStop(); route(); } return; }
  if(a==="export"){ copy(JSON.stringify(FAC), b); return; }
  if(a==="reset"){ if(confirm("Reset the whole facilitator session? A new session code is created.")){ FAC={session:randSession(),groups:5,cur:0,codes:true,ans:{},online:{}}; saveFac(); syncStop(); route(); } return; }
  if(a==="join"){ const n=+$("[data-act=gnum]").value, s=$("[data-act=gsession]").value.trim(); if(!s){ alert("Enter the session code."); return; } GRP={n,session:s,codes:GRP.codes!==false,ans:{},unlocked:0,notes:{},splashed:{},sent:{}}; DRAFT={}; saveGrp(); sfx("join"); route(); syncSend({t:"hello",g:n}); return; }
  if(a==="gleave"){ if(confirm("Leave this group and clear your answers on this device?")){ GRP={n:null,session:GRP.session,codes:GRP.codes,ans:{},unlocked:0,notes:{},splashed:{},sent:{}}; DRAFT={}; saveGrp(); route(); } return; }
  if(a==="unlock"){ const s=nextStage(), v=$("[data-act=gcode]").value.trim(); if(!GRP.codes || v===roundCode(GRP.session,s)){ GRP.unlocked=Math.max(GRP.unlocked,s); saveGrp(); sfx("unlock"); route(); } else { sfx("error"); $("#gmsg").textContent="That code is not right. Check with your facilitator."; } return; }
  if(a==="lvl"){ DRAFT.l=+b.dataset.v; sfx("level",DRAFT.l); route(); return; }
  if(a==="lens"){ const k=b.dataset.k; DRAFT.lens=DRAFT.lens||[]; DRAFT.lens=DRAFT.lens.includes(k)?DRAFT.lens.filter(x=>x!==k):[...DRAFT.lens,k]; route(); return; }
  if(a==="fopt"){ DRAFT.c=b.dataset.v; route(); return; }
  if(a==="submit"){
    const s=nextStage(); let ans;
    if(s===FINAL) ans={c:DRAFT.c, t:DRAFT.t||""};
    else { ans={l:DRAFT.l, t:DRAFT.t||""}; if(DRAFT.x) ans.x=Object.assign({},DRAFT.x); if(DRAFT.lens){ ans.x=Object.assign(ans.x||{},{lens:DRAFT.lens}); } }
    GRP.ans[s]=ans; GRP.lastSent=s; DRAFT={}; saveGrp(); SHOW_SENT=true; route();
    syncSend({t:"ans",g:GRP.n,s,a:ans}).then(ok=>{ GRP.sent[s]=!!ok; saveGrp(); const el=$("#sentnote"); if(el) el.textContent=ok?"Delivered to your facilitator ✓":"Not delivered yet. If it stays like this, tell your facilitator."; });
    return;
  }
  if(a==="next"){ e.preventDefault(); SHOW_SENT=false; route(); return; }
});
document.addEventListener("change",e=>{
  const el=e.target.closest("[data-act]"); if(!el) return; const a=el.dataset.act;
  if(a==="cell"){ const g=+el.dataset.g, s=+el.dataset.s, v=el.value?+el.value:null; const x=facAns(g); x[s]=Object.assign({},x[s]||{},{l:v}); saveFac(); route(); syncSend({t:"set",g,s,a:{l:v}}); }
  else if(a==="groups"){ FAC.groups=+el.value; saveFac(); route(); }
  else if(a==="session"){ FAC.session=el.value.trim()||randSession(); saveFac(); syncStop(); route(); }
  else if(a==="codes"){ FAC.codes=el.value==="1"; saveFac(); route(); syncSend({t:"settings",codes:FAC.codes}); }
});
document.addEventListener("input",e=>{
  const el=e.target.closest("[data-act]"); if(!el) return;
  if(el.dataset.act==="txt") DRAFT.t=el.value; else if(el.dataset.act==="fld"){ DRAFT.x=DRAFT.x||{}; DRAFT.x[el.dataset.k]=el.value; }
});
document.addEventListener("keydown",e=>{ if(e.key==="Enter" && e.target.matches("[data-act=pin]")) $("[data-act=pinok]").click(); });
window.L5 = {STATS, DATA, topicOf, roundCode, get FAC(){return FAC;}, get GRP(){return GRP;}, get SYNC(){return SYNC;}, curve, nextStage};
route();
</script>
</body>
</html>
